[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrollphathd"
dynamic = ["version"]
description = "Scroll pHAT HD Driver"
readme = "README.rst"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
maintainers = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
keywords = ["Raspberry Pi", "LED"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
    "Topic :: Software Development",
    "Topic :: System :: Hardware",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "smbus2",
]

[project.optional-dependencies]
http = ["flask"]

[project.urls]
Homepage = "https://www.pimoroni.com"
Source = "https://github.com/pimoroni/scroll-phat-hd"
GitHub = "https://github.com/pimoroni/scroll-phat-hd"

[dependency-groups]
dev = [
    "pytest",
    "mock",
]

[tool.hatch.version]
path = "scrollphathd/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "scrollphathd",
    "README.rst",
    "CHANGELOG.txt",
    "LICENSE.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["scrollphathd"]
